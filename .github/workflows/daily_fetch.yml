name: Daily Reuters News Fetcher

on:
  schedule:
    # 採用 UTC 時間。台灣時間 08:00 = UTC 00:00
    - cron: '0 21 * * *'
  workflow_dispatch: # 允許你手動在 GitHub 網站上點擊按鈕立即執行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予寫入權限，才能把 JSON 提交回專案

    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install requests beautifulsoup4

      - name: 執行抓取腳本
        run: |
          python fetch_news.py

      - name: 自動提交並推送 JSON 變更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_data/
          git commit -m "Auto-update daily news for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push